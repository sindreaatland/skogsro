<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Skogsro – 3D-prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { width: 100vw; height: 100vh; display: block; image-rendering: pixelated; }
  #h { position: fixed; left: 10px; top: 8px; color: #e8e4d4; font: 13px/1.5 monospace; text-shadow: 0 1px 2px #000; white-space: pre; }
</style>
</head>
<body>
<div id="h"></div>
<!-- Prototype: samme verden og samme kameravinkel som kartet, men terreng, trær og jeger som 3D-modeller.
     Bruker spillets egne høyder, bakkefarger og treplasseringer (src/01–03) og three.js fra nettet. -->
<script>const G = { cut: new Set(), huts: [] }, CHOP = {};</script>
<script src="../src/01-core.js"></script>
<script src="../src/02-sprites.js"></script>
<script src="../src/03-world.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  genAll();
  const R = new THREE.WebGLRenderer({ antialias: false });
  document.body.appendChild(R.domElement);
  R.shadowMap.enabled = true;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#33462f');
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 8000);
  // sola står i nordvest, som i skyggeleggingen av bakken på kartet
  const mat = o => new THREE.MeshPhongMaterial({ specular: 0x000000, shininess: 0, ...o });
  const amb = new THREE.AmbientLight(0xffffff, 0.62); scene.add(amb);
  const sun = new THREE.DirectionalLight(0xfff0dc, 0.6), SUN = new THREE.Vector3(-0.5, 0.8, -0.42).normalize();
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0015; sun.shadow.normalBias = 0.6;
  Object.assign(sun.shadow.camera, { left: -560, right: 560, top: 560, bottom: -560, near: 1, far: 4000 });
  scene.add(sun, sun.target);

  // ---------- modeller: flate fasetter i fargene fra spritene ----------
  const MAT = mat({ vertexColors: true });
  function merge(parts) {
    let n = 0;
    const gs = parts.map(([g, c]) => { g = g.index ? g.toNonIndexed() : g; n += g.attributes.position.count; return [g, new THREE.Color(c)]; });
    const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
    let o = 0;
    for (const [g, c] of gs) {
      const k = g.attributes.position.count;
      pos.set(g.attributes.position.array, o * 3);
      for (let i = 0; i < k; i++) col.set([c.r, c.g, c.b], (o + i) * 3);
      o += k;
    }
    const out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    out.setAttribute('color', new THREE.BufferAttribute(col, 3));
    out.computeVertexNormals();
    return out;
  }
  const cone = (r, h, y) => new THREE.ConeGeometry(r, h, 7).translate(0, y + h / 2, 0);
  const cyl = (rTop, rBot, h, y) => new THREE.CylinderGeometry(rTop, rBot, h, 6).translate(0, y + h / 2, 0);
  const blob = (rx, ry, x, y, z) => new THREE.IcosahedronGeometry(1, 1).scale(rx, ry, rx).translate(x, y, z);
  const GEO = {
    spruce: merge([[cyl(1.6, 2.3, 12, 0), '#46322a'], [cone(15, 26, 8), '#1d4038'], [cone(12.5, 24, 24), '#24503e'], [cone(9.5, 22, 40), '#295642'], [cone(6, 20, 58), '#33644a']]),
    pine: merge([[cyl(1.5, 2.4, 34, 0), '#564136'], [cyl(1.2, 1.5, 32, 34), '#9c5933'], [blob(13, 8, 0, 66, 0), '#294f35'], [blob(10, 7, 5, 73, 2), '#3b6b3d'], [blob(8, 6, -6, 71, -3), '#3b6b3d'], [blob(7, 5, 0, 80, 0), '#558847']]),
    // bjørk, rogn og tørrgran deler stamme og krone; fargen settes per tre
    trunk: merge([[cyl(1, 1.8, 46, 0), '#ffffff']]),
    crown: merge([[blob(11, 10, 0, 48, 0), '#cccccc'], [blob(9, 8, 5, 56, 2), '#ffffff'], [blob(8, 8, -5, 55, -3), '#f0f0f0'], [blob(7, 7, 0, 64, 0), '#ffffff']]),
  };

  // ---------- terreng og trær, bit for bit ----------
  const live = new Map(), M4 = new THREE.Matrix4(), Q = new THREE.Quaternion(), UP = new THREE.Vector3(0, 1, 0), V = new THREE.Vector3(), SC = new THREE.Vector3(), COLR = new THREE.Color();
  const SEG = CS / HG;
  function build(cx, cy) {
    const ch = getChunk(cx, cy), x0 = cx * CS, y0 = cy * CS, grp = new THREE.Group();
    if (!ch.gpix) genGround(ch);
    // bakken: ett punkt per høydepunkt i biten, med spillets tegnede bakke som tekstur
    const N = SEG + 1, pos = new Float32Array(N * N * 3), uv = new Float32Array(N * N * 2), idx = [];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const a = j * N + i;
      pos.set([x0 + i * HG, chunkH(ch, i * HG, j * HG), y0 + j * HG], a * 3); uv.set([i / SEG, j / SEG], a * 2);
      if (i < SEG && j < SEG) idx.push(a, a + N, a + 1, a + 1, a + N, a + N + 1);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); geo.setIndex(idx); geo.computeVertexNormals();
    const tex = new THREE.DataTexture(new Uint8Array(ch.gpix.buffer.slice(0)), CS, CS, THREE.RGBAFormat);
    tex.magFilter = tex.minFilter = THREE.NearestFilter; tex.needsUpdate = true;
    const ground = new THREE.Mesh(geo, mat({ map: tex }));
    ground.receiveShadow = true; grp.add(ground);
    // trærne der spillet har dem
    const set = { spruce: [], pine: [], trunk: [], crown: [] };
    for (const o of ch.objs) {
      const it = { o, s: 0.8 + 0.4 * hash2(o.x, o.y, 5), c: '#ffffff' };
      if (o.k === 'spruce' || o.k === 'pine') set[o.k].push(it);
      else if (o.k === 'birch') { set.trunk.push({ ...it, c: '#d8d4c4' }); set.crown.push({ ...it, c: BIRCH_TONES[o.v % BIRCH_TONES.length][2] }); }
      else if (o.k === 'rowan') { it.s *= 0.6; set.trunk.push({ ...it, c: '#6a5a4c' }); set.crown.push({ ...it, c: '#b4552a' }); }
      else if (o.k === 'snag') set.trunk.push({ ...it, c: '#7a7468' });
    }
    for (const k in set) {
      const L = set[k]; if (!L.length) continue;
      const im = new THREE.InstancedMesh(GEO[k], MAT, L.length);
      L.forEach((it, i) => {
        Q.setFromAxisAngle(UP, hash2(it.o.x, it.o.y, 6) * TAU);
        im.setMatrixAt(i, M4.compose(V.set(it.o.x, heightAt(it.o.x, it.o.y) - 1, it.o.y), Q, SC.set(it.s, it.s, it.s)));
        im.setColorAt(i, COLR.set(it.c));
      });
      im.castShadow = im.receiveShadow = true; im.frustumCulled = false; grp.add(im);
    }
    scene.add(grp);
    return { grp, geo, tex };
  }
  // bygg bitene rundt jegeren (høyst én per bilde etter starten) og kast dem som er langt unna
  function chunksAround(x, y, all) {
    const pcx = Math.floor(x / CS), pcy = Math.floor(y / CS);
    for (const [k, c] of live) {
      const [cx, cy] = k.split(',').map(Number);
      if (Math.max(Math.abs(cx - pcx), Math.abs(cy - pcy)) > 3) { scene.remove(c.grp); c.geo.dispose(); c.tex.dispose(); live.delete(k); }
    }
    for (let r = 0; r <= 2; r++) for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
      const k = (pcx + i) + ',' + (pcy + j);
      if (!live.has(k)) { live.set(k, build(pcx + i, pcy + j)); if (!all) return; }
    }
  }

  // ---------- jegeren: esker i fargene fra spriten, med ledd i hofter og skuldre ----------
  function box(w, h, d, col, x, y, z) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat({ color: col }));
    mesh.position.set(x, y, z); mesh.castShadow = true; return mesh;
  }
  function limb(x, y, parts) { const g = new THREE.Group(); g.position.set(x, y, 0); g.add(...parts); return g; }
  const man = new THREE.Group(), body = new THREE.Group();
  const leg = x => limb(x, 9, [box(3, 7.4, 3, '#4c3f32', 0, -3.7, 0), box(3.2, 1.8, 4, '#231c18', 0, -8.1, 0.5)]);
  const arm = x => limb(x, 16.6, [box(2.4, 6.4, 2.6, '#3f502e', 0, -3.2, 0), box(2, 1.6, 2, '#e4b48c', 0, -7.2, 0)]);
  const legL = leg(-2), legR = leg(2), armL = arm(-5.2), armR = arm(5.2);
  const rifle = box(0.9, 15, 0.9, '#201a18', 1.5, 15, -5.2); rifle.rotation.z = 0.5;
  const disc = (r, h, col, y) => { const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 8), mat({ color: col })); mesh.position.y = y; mesh.castShadow = true; return mesh; };
  body.add(box(8, 8, 4.6, '#586c3e', 0, 13, 0), armL, armR, box(5, 4.6, 4.8, '#e4b48c', 0, 19.3, 0), box(5.2, 2, 1.2, '#6b4a30', 0, 18, 2.4),
    disc(4.8, 0.8, '#2c4430', 21.9), disc(3, 0.7, '#ee7c2a', 22.6), disc(2.9, 2.2, '#3f5c3a', 24), box(6, 6.5, 2.6, '#80583a', 0, 13.5, -3.5), rifle);
  man.add(legL, legR, body); scene.add(man);

  // ---------- hjorten: kropp, hals og hode av esker, bein med ledd i hofte og kne ----------
  const DC = { coat: '#8a5a3a', dark: '#6e4630', leg: '#5c3e2a', pale: '#d8c8a0', horn: '#c8b890', hoof: '#2a2018' };
  const deer = new THREE.Group(), dBody = new THREE.Group(), dNeck = new THREE.Group(), dHead = new THREE.Group();
  // avrundede former: kuler strukket til ellipsoider og rør som smalner, med mykt lys over flatene
  const shape = (geo, col, x, y, z) => { const mesh = new THREE.Mesh(geo, mat({ color: col })); mesh.position.set(x, y, z); mesh.castShadow = true; return mesh; };
  const ball = (rx, ry, rz, col, x, y, z) => shape(new THREE.IcosahedronGeometry(1, 2).scale(rx, ry, rz), col, x, y, z);
  const tube = (rTop, rBot, h, col, x, y, z) => shape(new THREE.CylinderGeometry(rTop, rBot, h, 8), col, x, y, z);
  const tilt = (mesh, rx, rz) => { mesh.rotation.x = rx; mesh.rotation.z = rz; return mesh; };
  function dLeg(x, z) {
    const hip = new THREE.Group(), knee = new THREE.Group();
    hip.position.set(x, 11.5, z); knee.position.y = -5.5;
    knee.add(ball(1, 1, 1, DC.leg, 0, 0, 0), tube(0.85, 0.7, 5.5, DC.leg, 0, -2.75, 0), tube(0.8, 1, 1.2, DC.hoof, 0, -5.4, 0.1));
    hip.add(ball(1.9, 2.8, 2.3, DC.coat, 0, -0.3, 0), tube(1.6, 1, 6.2, DC.coat, 0, -2.6, 0), knee); hip.knee = knee;
    return hip;
  }
  const dLegs = [dLeg(-2.4, 7.5), dLeg(2.4, 7.5), dLeg(-2.4, -7.5), dLeg(2.4, -7.5)];
  dHead.add(ball(2.2, 2.3, 3, DC.coat, 0, 0.5, 1), tilt(tube(1, 1.7, 4.6, DC.dark, 0, -0.3, 5), Math.PI / 2, 0), ball(1.1, 0.95, 0.8, DC.hoof, 0, -0.3, 7.3));
  for (const s of [-1, 1]) dHead.add(tilt(ball(0.6, 1.6, 0.9, DC.dark, s * 2.6, 2.6, -0.8), 0, -s * 0.7), tilt(tube(0.3, 0.45, 8, DC.horn, s * 2, 6, -1), -0.25, -s * 0.4),
    tilt(tube(0.25, 0.35, 4, DC.horn, s * 3.2, 8.5, 0.6), 0.9, -s * 0.3), tilt(tube(0.25, 0.35, 3.2, DC.horn, s * 2.2, 4.6, 1), 1.1, 0));
  dHead.position.y = 11; dNeck.position.set(0, 18, 8.5);
  dNeck.add(ball(2.8, 2.8, 2.8, DC.dark, 0, 0.5, 0), tube(1.7, 2.5, 11, DC.dark, 0, 5.5, 0), dHead);
  dBody.add(ball(4, 4.9, 6.5, DC.coat, 0, 15.6, -4.5), ball(3.7, 4.5, 7, DC.coat, 0, 15.3, 0), ball(4.2, 5.2, 6.5, DC.coat, 0, 15.8, 4.5), ball(3.1, 2.4, 7.5, '#b08a62', 0, 12.7, 0),
    ball(2.8, 3, 1.2, DC.pale, 0, 16.2, -10.2), ball(0.9, 2, 0.8, DC.pale, 0, 16, -11.2), dNeck);
  deer.add(dBody, ...dLegs); scene.add(deer);
  // beiter, rusler litt, løfter hodet og ser på deg når du kommer nær, og springer unna når du kommer for nær
  const D = { x: -565, y: 275, hx: -565, hy: 275, yaw: 2, st: 'graze', t: 4, tx: 0, ty: 0, ph: 0, neck: 2.55, look: 0 };
  const angD = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
  function deerUpdate(dt, now) {
    const dx = P.x - D.x, dy = P.y - D.y, d = hyp(dx, dy);
    if (d < 55 && D.st !== 'flee') { D.st = 'flee'; D.t = 2.5; }
    else if (d < 110 && (D.st === 'graze' || D.st === 'walk')) { D.st = 'look'; D.t = 3; }
    D.t -= dt;
    let sp = 0, neck = 0.55, want = D.yaw, look = 0;
    if (D.st === 'graze') {
      neck = 2.55 + Math.sin(now * 3) * 0.05;
      if (D.t < 0) {
        if (Math.random() < 0.3) { D.st = 'look'; D.t = rnd(1.5, 3); }
        else {
          D.st = 'graze'; D.t = rnd(2, 4);
          for (let i = 0; i < 5; i++) { const a = rnd(0, TAU), r = rnd(25, 70), tx = D.hx + Math.sin(a) * r, ty = D.hy + Math.cos(a) * r; if (!isWater(tx, ty)) { D.tx = tx; D.ty = ty; D.st = 'walk'; D.t = 12; break; } }
        }
      }
    } else if (D.st === 'look') {
      neck = 0.3; if (d < 160) look = clamp(angD(Math.atan2(dx, dy), D.yaw), -1.3, 1.3);
      if (D.t < 0) { D.st = 'graze'; D.t = rnd(4, 9); }
    } else if (D.st === 'walk') {
      sp = 14; neck = 0.8; want = Math.atan2(D.tx - D.x, D.ty - D.y);
      if (D.t < 0 || hyp(D.tx - D.x, D.ty - D.y) < 4) { D.st = 'graze'; D.t = rnd(4, 9); }
    } else {
      sp = 120; neck = 0.75; want = Math.atan2(-dx, -dy);
      for (const k of [0, 0.8, -0.8, 1.6, -1.6]) if (!isWater(D.x + Math.sin(want + k) * 30, D.y + Math.cos(want + k) * 30)) { want += k; break; }
      if (D.t < 0) { if (d > 170) { D.st = 'look'; D.t = 3; D.hx = D.x; D.hy = D.y; } else D.t = 1; }
    }
    const run = D.st === 'flee';
    D.yaw += angD(want, D.yaw) * Math.min(1, dt * (run ? 8 : 3));
    D.x += Math.sin(D.yaw) * sp * dt; D.y += Math.cos(D.yaw) * sp * dt;
    D.ph = sp ? D.ph + dt * Math.min(16, sp * 0.3) : 0;
    D.neck = lerp(D.neck, neck, Math.min(1, dt * (run ? 10 : 3))); D.look = lerp(D.look, look, Math.min(1, dt * 4));
    // i gange går beina diagonalt i takt, i sprang går framme og bak hver for seg
    const off = run ? [0, 0.5, Math.PI, Math.PI + 0.5] : [0, Math.PI, Math.PI, 0], A = run ? 0.9 : 0.45, B = run ? 1.1 : 0.7;
    dLegs.forEach((lg, i) => { lg.rotation.x = sp ? -Math.sin(D.ph + off[i]) * A : 0; lg.knee.rotation.x = sp ? Math.max(0, Math.cos(D.ph + off[i])) * B : 0; });
    dNeck.rotation.x = D.neck; dHead.rotation.set(0.75 - D.neck * 0.65, D.look, 0);
    dBody.position.y = run ? Math.abs(Math.sin(D.ph)) * 2 : 0;
    deer.position.set(D.x, heightAt(D.x, D.y), D.y); deer.rotation.y = D.yaw;
  }

  // ---------- bålet: steinring, kubber og flammer som lyser selv, og et lys som kaster skygger ----------
  const FIRE = { x: -505, y: 372 }, fire = new THREE.Group(), flames = [];
  for (let i = 0; i < 7; i++) { const a = i / 7 * TAU, st = new THREE.Mesh(new THREE.IcosahedronGeometry(1.7, 0), mat({ color: i & 1 ? '#727876' : '#50565a' })); st.position.set(Math.cos(a) * 5.5, 0.8, Math.sin(a) * 5.5); st.castShadow = true; fire.add(st); }
  for (let i = 0; i < 3; i++) { const lg = box(1.4, 1.4, 8, '#46322a', 0, 1.2, 0); lg.rotation.y = i * TAU / 6; fire.add(lg); }
  [[2.4, 8, '#ff7a22'], [1.7, 6, '#ffb030'], [1, 4, '#ffe890']].forEach(([r, h, c]) => { const f = new THREE.Mesh(new THREE.ConeGeometry(r, h, 6).translate(0, h / 2, 0), new THREE.MeshBasicMaterial({ color: c })); f.position.y = 1.5; flames.push(f); fire.add(f); });
  const glow = new THREE.PointLight(0xff9440, 1, 210, 1.5);
  glow.position.y = 24; glow.castShadow = true; glow.shadow.mapSize.set(512, 512); glow.shadow.camera.near = 2; glow.shadow.camera.far = 210; glow.shadow.bias = -0.004;
  fire.add(glow); fire.position.set(FIRE.x, heightAt(FIRE.x, FIRE.y), FIRE.y); scene.add(fire);

  // ---------- døgnet: fargen på lyset som i spillet, sola fra øst om morgenen til vest om kvelden, måne om natta ----------
  const LIGHT = [[0, '#3c4878'], [4.5, '#3c4878'], [5.6, '#a088a8'], [6.6, '#f0b8a0'], [8, '#fff0dc'], [10, '#ffffff'], [16.5, '#ffffff'], [18, '#ffd8a0'], [19.3, '#e09078'], [20.5, '#6a6090'], [21.5, '#3c4878'], [24, '#3c4878']].map(([h, c]) => [h, new THREE.Color(c)]);
  let hour = 15, flow = true;
  function daylight(now) {
    for (let i = 0; i < LIGHT.length - 1; i++) if (hour <= LIGHT[i + 1][0]) { amb.color.copy(LIGHT[i][1]).lerp(LIGHT[i + 1][1], (hour - LIGHT[i][0]) / (LIGHT[i + 1][0] - LIGHT[i][0])); break; }
    const sunK = smooth(5.5, 7, hour) * (1 - smooth(19, 20.5, hour)), moonK = hour < 12 ? 1 - smooth(4.6, 5.5, hour) : smooth(20.5, 21.5, hour);
    amb.intensity = lerp(0.9, 0.62, sunK);
    scene.background.set('#33462f').multiply(amb.color);
    if (sunK > 0) {
      const t = clamp((hour - 5.5) / 15, 0, 1), up = Math.sin(Math.PI * t), el = (6 + 49 * up) * Math.PI / 180;
      SUN.set(Math.cos(Math.PI * t) * Math.cos(el), Math.sin(el), -Math.sin(Math.PI * t) * Math.cos(el));
      sun.color.set('#ffa868').lerp(COLR.set('#fff0dc'), smooth(0.1, 0.6, up)); sun.intensity = 0.62 * sunK;
    } else { SUN.set(-0.45, 0.8, -0.4).normalize(); sun.color.set('#8ea4e0'); sun.intensity = 0.3 * moonK; }
    // bålet blafrer, og lyser mest når det er mørkt
    const fl = 0.85 + 0.15 * Math.sin(now * 11) + 0.1 * Math.sin(now * 23.7);
    glow.intensity = fl * lerp(3.2, 0.7, sunK);
    flames.forEach((f, i) => { f.scale.set(1 + 0.15 * Math.sin(now * 9 + i * 2), 1 + 0.3 * Math.sin(now * 13 + i * 1.7), 1); f.rotation.y = now * (2 + i); });
  }

  // ---------- styring og bilde ----------
  const keys = {}, P = { x: 0, y: 0, h: 0, yaw: 0, ph: 0 };
  const start = location.hash.slice(1).split(',').map(Number);
  P.x = start[0] || -530; P.y = start[1] || 400;
  let pix = true, pitch = 45, last = performance.now();
  const T3 = new THREE.Vector3();
  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1), z = pix ? Math.max(2, Math.round(innerHeight * dpr / 420)) : 1;
    R.setPixelRatio(1); R.setSize(Math.ceil(innerWidth * dpr / z), Math.ceil(innerHeight * dpr / z), false);
  }
  addEventListener('resize', resize);
  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyP') { pix = !pix; resize(); }
    if (e.code === 'KeyZ') pitch = Math.max(25, pitch - 5);
    if (e.code === 'KeyX') pitch = Math.min(85, pitch + 5);
    if (e.code === 'KeyT') flow = !flow;
    const set = { Digit1: 6.3, Digit2: 12, Digit3: 19, Digit4: 23 }[e.code];
    if (set) hour = set;
  });
  addEventListener('keyup', e => { keys[e.code] = false; });
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    let mx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0), my = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
    const l = hyp(mx, my), run = keys.ShiftLeft || keys.ShiftRight, sp = run ? 150 : 55;
    if (l) {
      P.x += mx / l * sp * dt; P.y += my / l * sp * dt; P.ph += dt * (run ? 13 : 8);
      const want = Math.atan2(mx, my), d = Math.atan2(Math.sin(want - P.yaw), Math.cos(want - P.yaw));
      P.yaw += d * Math.min(1, dt * 12);
    } else P.ph = 0;
    P.h = heightAt(P.x, P.y);
    const sw = Math.sin(P.ph) * (run ? 0.9 : 0.6);
    legL.rotation.x = sw; legR.rotation.x = -sw; armL.rotation.x = -sw * 0.7; armR.rotation.x = sw * 0.7;
    body.position.y = l ? Math.abs(Math.cos(P.ph)) * 0.8 : 0;
    man.position.set(P.x, P.h, P.y); man.rotation.y = P.yaw;
    chunksAround(P.x, P.y, false);
    if (flow) hour = (hour + dt / 5) % 24;
    deerUpdate(dt, now / 1000); daylight(now / 1000);

    // samme bilde som kartet: rett nordover, skrått ned, uten perspektiv
    const a = innerWidth / innerHeight, vh = 420, pr = pitch * Math.PI / 180;
    cam.left = -vh * a / 2; cam.right = vh * a / 2; cam.top = vh / 2; cam.bottom = -vh / 2; cam.updateProjectionMatrix();
    T3.lerp(V.set(P.x, P.h + 10, P.y), Math.min(1, dt * 5));
    cam.position.set(T3.x, T3.y + Math.sin(pr) * 3000, T3.z + Math.cos(pr) * 3000); cam.lookAt(T3);
    sun.target.position.copy(T3); sun.position.copy(T3).addScaledVector(SUN, 1500);
    R.render(scene, cam);
    $('h').textContent = `3D-prototype   WASD går · Shift springer · P piksler ${pix ? 'på' : 'av'} · Z/X kameravinkel ${pitch}°\nkl. ${String(hour | 0).padStart(2, '0')}:${String((hour % 1) * 60 | 0).padStart(2, '0')}   1 morgen · 2 dag · 3 kveld · 4 natt · T tida ${flow ? 'går' : 'står'}`;
    requestAnimationFrame(frame);
  }
  resize();
  chunksAround(P.x, P.y, true);
  T3.set(P.x, heightAt(P.x, P.y) + 10, P.y);
  requestAnimationFrame(frame);
})();
</script>
